# patient-service
spring.cloud.gateway.server.webmvc.routes[0].id=patient-service
spring.cloud.gateway.server.webmvc.routes[0].uri=lb://PATIENT-SERVICE
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/api/patients/**,/api/patients

# appointment-service
spring.cloud.gateway.server.webmvc.routes[1].id=appointment-service
spring.cloud.gateway.server.webmvc.routes[1].uri=lb://APPOINTMENT-SERVICE
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/api/appointments/**,/api/appointments
spring.cloud.gateway.server.webmvc.routes[1].filters[0].name=CircuitBreaker
spring.cloud.gateway.server.webmvc.routes[1].filters[0].args.id=appointmentCB
spring.cloud.gateway.server.webmvc.routes[1].filters[0].args.fallbackUri=forward:/fallback/appointments
spring.cloud.gateway.server.webmvc.routes[1].filters[0].args.statusCodes=500,502,503,504

# e-prescription-service
spring.cloud.gateway.server.webmvc.routes[2].id=e-prescription-service
spring.cloud.gateway.server.webmvc.routes[2].uri=lb://E-PRESCRIPTION-SERVICE
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/api/prescriptions/**,/api/prescriptions

# pharmacy-service
spring.cloud.gateway.server.webmvc.routes[3].id=pharmacy-service
spring.cloud.gateway.server.webmvc.routes[3].uri=lb://PHARMACY-SERVICE
spring.cloud.gateway.server.webmvc.routes[3].predicates[0]=Path=/api/medications/**,/api/medications,/api/categories/**,/api/categories,/api/stocks/**,/api/stocks,/api/stock-movements/**,/api/stock-movements,/api/dispensations/**,/api/dispensations

# smart-service
spring.cloud.gateway.server.webmvc.routes[4].id=smart-service
spring.cloud.gateway.server.webmvc.routes[4].uri=lb://SMART-SERVICE
spring.cloud.gateway.server.webmvc.routes[4].predicates[0]=Path=/api/smart/**,/api/smart
