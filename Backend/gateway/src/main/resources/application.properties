spring.application.name=smartcare-api-gateway
server.port=${GATEWAY_PORT:8080}
spring.profiles.active=${GATEWAY_PROFILE:static}

eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when_authorized
management.info.env.enabled=true

info.app.name=SmartCare API Gateway
info.app.description=Gateway MVC du projet SmartCare
info.app.version=1.0.0

logging.level.org.springframework.cloud.gateway=INFO
logging.level.org.springframework.cloud.loadbalancer=INFO
