
# Nom du microservice
spring.application.name=pharmacy-service

# Port du microservice
server.port=8074

# MongoDB local
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/pharmacy_db?replicaSet=rs0}
# Eureka Server
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# Actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# Informations Actuator
management.info.env.enabled=true
info.app.name=Pharmacy Service
info.app.description=Smart Hospital Pharmacy Microservice
info.app.version=1.0
